services:
  neo4j:
    image: neo4j:5-community
    container_name: mirofish-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional cross-encoder reranker — local replacement for the
  # LLM-based reranker. Only used when RERANKER_PROVIDER=tei.
  # CPU image runs anywhere; for GPU use ghcr.io/huggingface/text-
  # embeddings-inference:1.5 with --gpus all. ~500MB RAM on CPU,
  # 50-100ms per rerank vs 1-2s through Sonnet.
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: mirofish-tei-reranker
    ports:
      - "${TEI_PORT:-8081}:80"
    command: --model-id ${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - tei_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    profiles:
      - tei  # opt-in: `docker compose --profile tei up -d`

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  tei_cache:
